  reference_answer: $1,802 total, made up of 0.25% points ($405), an application fee ($300), and an underwriting fee ($1,097).
  evidence:
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 3}
  kind: table
  notes: ""

- id: le-fixed-shoppable-services
  question: On the fixed-rate Loan Estimate, how much were the services I can shop for, and which one was the most expensive?
  reference_answer: $3,198 in total; the most expensive item was the title search at $1,261.
  evidence:
    - {filename: cfpb_loan_estimate_h24b_fixed_rate.pdf, page: 3}
  kind: table
  notes: ""

- id: cd-fixed-real-estate-commissions
  question: How much real estate commission was paid in the fixed-rate home sale, and who paid it?
  reference_answer: $5,700 to Alpha Real Estate Broker and $5,700 to Omega Real Estate Broker ($11,400 total), paid by the seller.
  evidence:
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 3}
  kind: table
  notes: "Seller-paid confirmed arithmetically: Seller-Paid at Closing subtotal $12,800 = transfer tax $950 + home warranty $450 + commissions $11,400, and borrower-paid Section H is only $2,400. The Docling table for this row is garbled (amounts drift into other columns), so this is a hard table question."

- id: le-io-arm-rate-adjustments
  question: How does the rate on the interest-only ARM change over time?
  reference_answer: It is MTA index + 4% margin, starting at 4%; first change at the beginning of the 61st month, then every 36 months; each change is capped at 2%; the rate stays between 3.25% and 12%.
  evidence:
    - {filename: cfpb_loan_estimate_h24c_interest_only_arm.pdf, page: 3}
  kind: table
  notes: ""

- id: le-fixed-projected-payments
  question: For the fixed-rate loan, how much will my total monthly payment be at first, and how much after year 7?
  reference_answer: About $1,050 a month in years 1-7, dropping to about $968 in years 8-30 once mortgage insurance ends.
  evidence:
    - {filename: cfpb_loan_estimate_h24b_fixed_rate.pdf, page: 2}
  kind: table
  notes: "The matching CD (h25b page 2) has the same table with cents ($1,050.26 / $967.91); only the LE is cited."

