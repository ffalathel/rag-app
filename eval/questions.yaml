  question: Over the life of the fixed-rate loan, how much will I pay in total and how much of that is the cost of borrowing?
  reference_answer: Total of payments $285,803.36; finance charge $118,830.27.
  evidence:
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 6}
  kind: table
  notes: ""

- id: cd-fixed-prepaid-interest
  question: How much prepaid interest did the fixed-rate borrowers pay at closing, and for what period?
  reference_answer: $279.04, at $17.44 per day from 4/15/13 to 5/1/13.
  evidence:
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 3}
  kind: table
  notes: ""

- id: le-io-arm-payment-range-later-years
  question: What range could my monthly payment be on the interest-only ARM in years 12 through 30?
  reference_answer: Between $1,028 and $2,068 a month.
  evidence:
    - {filename: cfpb_loan_estimate_h24c_interest_only_arm.pdf, page: 2}
  kind: table
  notes: ""

- id: toolkit-points-tradeoff
  question: In the toolkit's example, what do I get if I pay extra points to lower my rate?
  reference_answer: Paying 0.375 points (about $675 more at closing) lowers the rate from 5.0% to 4.875% on the $180,000 30-year example loan.
  evidence:
    - {filename: cfpb_home_loan_toolkit.pdf, page: 10}
  kind: table
  notes: ""

- id: cd-refi-initial-escrow
  question: On the refinance Closing Disclosure, what went into the initial escrow deposit at closing?
  reference_answer: $576.95 total, homeowner's insurance $201.66, mortgage insurance $164.70, property taxes $210.60, and a -$0.01 aggregate adjustment.
  evidence:
    - {filename: cfpb_closing_disclosure_h25e_refinance.pdf, page: 3}
  kind: table
  notes: "File cfpb_closing_disclosure_h25e_refinance.pdf is H-25(E), the refinance CD matching LE H-24(D). H-25(G) page 3 has an identical escrow block ($576.95); a retriever returning that page instead scores a miss."

# --- multi_hop ----------------------------------------------------------------

- id: fixed-apr-le-vs-cd
  question: For the fixed-rate loan, did the APR change between the Loan Estimate and the Closing Disclosure?
  reference_answer: Yes, it went from 4.274% on the Loan Estimate to 4.174% on the Closing Disclosure (0.1 point lower).
  evidence:
    - {filename: cfpb_loan_estimate_h24b_fixed_rate.pdf, page: 4}
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 6}
  kind: multi_hop
  notes: "Cross-document. The TIP moved too (69.45% -> 69.46%)."

- id: fixed-title-search-le-vs-cd
  question: How much did the title search end up costing compared to what the lender first estimated on the fixed-rate loan?
  reference_answer: Estimated at $1,261 on the Loan Estimate; the final charge was $800.00, i.e. $461 less.
  evidence:
    - {filename: cfpb_loan_estimate_h24b_fixed_rate.pdf, page: 3}
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 3}
  kind: multi_hop
  notes: "Cross-document."

- id: fixed-prepaid-interest-le-vs-cd
  question: Why did the prepaid interest on the fixed-rate loan come out higher at closing than on the estimate?
  reference_answer: The estimate assumed 15 days at $17.44/day ($262); at closing it covered 4/15/13 to 5/1/13 (16 days), $279.04.
  evidence:
    - {filename: cfpb_loan_estimate_h24b_fixed_rate.pdf, page: 3}
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 3}
  kind: multi_hop
  notes: "Cross-document. The 16-day count is inferred from the dates; the CD does not state it."

- id: refi-loan-costs-le-vs-cd
  question: For the refinance, how did the total loan costs on the Closing Disclosure compare with the Loan Estimate?
  reference_answer: They went down slightly, from $3,521 on the Loan Estimate to $3,495.50 at closing.
  evidence:
    - {filename: cfpb_loan_estimate_h24d_refinance.pdf, page: 2}
    - {filename: cfpb_closing_disclosure_h25e_refinance.pdf, page: 2}
  kind: multi_hop
  notes: "Cross-document. Pairs LE H-24(D) with CD H-25(E); the H-25(E) cover page says it illustrates the H-24(D) transaction. Loan amount, rate and P&I match ($150,000, 4.25%, $737.91)."

- id: fixed-shoppable-within-tolerance
  question: The toolkit says fees for services I shop for generally can't rise more than 10%. Did the fixed-rate loan's shoppable services stay within that?
  reference_answer: Yes. They were estimated at $3,198 and came in at $2,655.50 on the Closing Disclosure, a decrease.
  evidence:
    - {filename: cfpb_home_loan_toolkit.pdf, page: 20}
    - {filename: cfpb_loan_estimate_h24b_fixed_rate.pdf, page: 3}
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 3}
  kind: multi_hop
  notes: "Cross-document (three docs). Simplifies the 10% tolerance rule to the toolkit's wording."

- id: fixed-what-changed-checklist
  question: The closing checklist tells me to compare my Closing Disclosure with my Loan Estimate using a table. For the fixed-rate sample, which amounts changed?
  reference_answer: The table at the top of page 3 of the CD (physical page 4) shows changes in Total Closing Costs ($8,054 -> $9,712.10), Closing Costs Paid Before Closing ($0 -> $29.80), Seller Credits ($0 -> -$2,500), and Adjustments and Other Credits ($0 -> -$1,035.04); cash to close went from $16,054 to $14,147.26.
  evidence:
    - {filename: cfpb_mortgage_closing_checklist_scanned.pdf, page: 3}
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 4}
  kind: multi_hop
  notes: "Cross-document; the checklist page is scanned (OCR)."

- id: fixed-pmi-why
  question: Why does the fixed-rate loan include mortgage insurance, and how much is it per month?
  reference_answer: The borrowers put down $18,000 on a $180,000 home (10%), under the 20% threshold where lenders generally require mortgage insurance; it is $82 a month in years 1-7.
  evidence:
    - {filename: cfpb_home_loan_toolkit.pdf, page: 9}
    - {filename: cfpb_loan_estimate_h24b_fixed_rate.pdf, page: 2}
  kind: multi_hop
  notes: "Cross-document. The 20% threshold is stated on toolkit pages 5 and 9; page 9 (down payment choices, PMI) is cited. The down payment is also on LE page 3 ($18,000); the sale price and loan amount on page 2 are enough."

- id: io-arm-when-principal-starts
  question: On the interest-only ARM, when do I start paying down principal, and what will my principal and interest payment be then?
  reference_answer: Starting with the 61st payment (year 6), principal and interest will be between $1,028 and $1,359 a month, up from $703.33 interest-only.
  evidence:
    - {filename: cfpb_loan_estimate_h24c_interest_only_arm.pdf, page: 2}
    - {filename: cfpb_loan_estimate_h24c_interest_only_arm.pdf, page: 3}
  kind: multi_hop
  notes: "Same document, two pages. Page 2 alone gives the year-6 range; page 3 (AP table) gives the 61st payment."

- id: fixed-escrow-year-one
  question: For the fixed-rate loan, how much goes into escrow over the first year, and how does that match my monthly escrow payment?
  reference_answer: $2,473.56 over year 1, which is 12 x the $206.13 monthly escrow payment (homeowner's insurance and property taxes).
  evidence:
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 2}
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 5}
  kind: multi_hop
  notes: "Same document. Page 5 also states the $206.13 monthly escrow payment, so page 5 alone can answer it."

- id: cash-out-refi-why-bring-cash
  question: In the refinance where the borrower had to bring money to closing, why was the new loan not enough, and how much cash was needed?
  reference_answer: The $150,000 loan did not cover the $151,000 in payoffs plus closing costs, so the borrower had to bring $6,716.60 to closing.
  evidence:
    - {filename: cfpb_closing_disclosure_h25g.pdf, page: 2}
    - {filename: cfpb_closing_disclosure_h25g.pdf, page: 4}
  kind: multi_hop
  notes: "Same document. Page 4 alone has loan amount, payoffs and cash to close, so page 2 is corroborating."

