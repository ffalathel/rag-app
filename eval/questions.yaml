# Ground-truth questions for the docuchat evaluation harness.
# Evidence pages are 1-based physical PDF page indexes (never the printed page label).
# Owner-verified 2026-09-30.

# --- fact ---------------------------------------------------------------------

- id: le-fixed-rate-lock-expiry
  question: On the fixed-rate Loan Estimate, how long is my interest rate locked for?
  reference_answer: Until 4/16/2013 at 5:00 p.m. EDT.
  evidence:
    - {filename: cfpb_loan_estimate_h24b_fixed_rate.pdf, page: 2}
  kind: fact
  notes: ""

- id: cd-fixed-settlement-agent
  question: Which company is handling the closing for the fixed-rate home purchase?
  reference_answer: Epsilon Title Co. is the settlement agent (file # 12-3456).
  evidence:
    - {filename: cfpb_closing_disclosure_h25b.pdf, page: 2}
  kind: fact
  notes: ""

- id: le-fixed-late-fee
  question: Under the fixed-rate loan offer, what does it cost me if I pay my mortgage late?
  reference_answer: If the payment is more than 15 days late, the lender charges a late fee of 5% of the monthly principal and interest payment.
  evidence:
    - {filename: cfpb_loan_estimate_h24b_fixed_rate.pdf, page: 4}
  kind: fact
  notes: "The same 5% / 15-day late fee also appears on every sample Closing Disclosure page 5; only the LE page is cited."

- id: le-balloon-final-payment
  question: For the seven-year balloon loan, how much will I owe in one lump sum at the end?
  reference_answer: About $149,263 ($149,262.95), due at the end of year 7.
  evidence:
    - {filename: cfpb_loan_estimate_h24e_balloon.pdf, page: 2}
  kind: fact
  notes: ""

- id: le-negam-max-balance
  question: With the negative amortization loan, how large could my loan balance get?
  reference_answer: It can go as high as $176,032, and it can keep increasing until year 6.
  evidence:
    - {filename: cfpb_loan_estimate_h24f_negative_amortization.pdf, page: 2}
  kind: fact
  notes: ""

- id: le-io-arm-max-rate
  question: On the interest-only adjustable loan, what is the highest my interest rate could ever go?
  reference_answer: 12%, which it can reach in year 15.
  evidence:
    - {filename: cfpb_loan_estimate_h24c_interest_only_arm.pdf, page: 2}
  kind: fact
  notes: "The AIR table on page 3 also lists the 12% maximum; page 2 is cited as the primary statement."

- id: toolkit-credit-shopping-window
  question: How long do I have to shop around with different mortgage lenders without really hurting my credit score?
  reference_answer: Generally between 14 and 45 days, depending on the scoring model.
  evidence:
    - {filename: cfpb_home_loan_toolkit.pdf, page: 7}
  kind: fact
  notes: ""

- id: toolkit-housing-payment-rule-of-thumb
  question: What share of my income should my total monthly home payment be, as a rule of thumb?
  reference_answer: At or below 28% of total monthly income before taxes.
  evidence:
    - {filename: cfpb_home_loan_toolkit.pdf, page: 6}
  kind: fact
  notes: ""

- id: toolkit-cd-timing
  question: How long before my closing should I receive my Closing Disclosure?
  reference_answer: At least three (business) days before closing.
  evidence:
    - {filename: cfpb_home_loan_toolkit.pdf, page: 20}
  kind: fact
  notes: "Also stated on the scanned checklist page 2 ('three business days before closing'). Only the toolkit page is cited; a retriever surfacing only the checklist page scores a miss. Owner may want to add the checklist page as alternate evidence."

- id: toolkit-shoppable-services-increase
  question: Can the fees for services I picked myself go up between the Loan Estimate and closing?
  reference_answer: They might increase at closing, but generally by no more than 10% of the costs listed on the final Loan Estimate.
  evidence:
    - {filename: cfpb_home_loan_toolkit.pdf, page: 20}
  kind: fact
  notes: "Paraphrases the toolkit's simplified statement; the real tolerance rules are more nuanced."

- id: guide-refinance-cancel-window
  question: I'm refinancing. If I change my mind after signing, how long do I have to back out?
  reference_answer: Three business days; in some circumstances up to three years if information on the Closing Disclosure is missing or wrong. Notice must be given to the lender in writing.
  evidence:
    - {filename: cfpb_closing_forms_guide.pdf, page: 5}
  kind: fact
  notes: "Toolkit page 27 also mentions rescinding a refinance or HELOC within three days; not cited."

- id: guide-acceleration
  question: What can my lender do if I stop making my mortgage payments, according to the acceleration section?
  reference_answer: The lender can declare the loan in default and demand the entire loan be paid off immediately; if you can't pay, it can start foreclosure.
  evidence:
    - {filename: cfpb_closing_forms_guide.pdf, page: 3}
  kind: fact
  notes: ""

- id: checklist-what-to-bring
  question: What should I bring with me on closing day?
  reference_answer: A cashier's check or proof of wire transfer for the exact amount, the list of people to call, your Closing Disclosure, optionally a trusted friend/advisor/lawyer, your co-borrower or co-signer, your checkbook, and your driver's license or ID.
  evidence:
    - {filename: cfpb_mortgage_closing_checklist_scanned.pdf, page: 4}
  kind: fact
  notes: "Scanned (OCR) page. Answer read from the rendered image."

- id: checklist-opt-out-offers
  question: After buying my house, how can I stop getting credit card and home equity line offers in the mail?
  reference_answer: Opt out online or by calling (888) 567-8688.
  evidence:
    - {filename: cfpb_mortgage_closing_checklist_scanned.pdf, page: 6}
  kind: fact
  notes: "Scanned (OCR) page; depends on OCR reading the phone number correctly."

- id: checklist-wire-scam
  question: What should I do if I get an email right before closing telling me to send my money to a different account?
  reference_answer: Treat it as a possible scam and confirm the payment details with the trusted parties you recorded, using only the primary phone numbers you saved.
  evidence:
    - {filename: cfpb_mortgage_closing_checklist_scanned.pdf, page: 3}
  kind: fact
  notes: "Scanned (OCR) page."

- id: cd-second-lien-funds
  question: In the second-lien sample, how much money did the borrower bring in from the second loan?
  reference_answer: $96,500.00, from a second loan with a $100,000 principal balance.
  evidence:
    - {filename: cfpb_closing_disclosure_h25c_second_lien.pdf, page: 2}
  kind: fact
  notes: ""

- id: cd-junior-lien-satisfaction
  question: In the sample where the borrower paid off the seller's second lien outside of closing, how much was it?
  reference_answer: $5,000, paid outside of closing (P.O.C.) by the borrower.
  evidence:
    - {filename: cfpb_closing_disclosure_h25d_seller_second_lien.pdf, page: 2}
  kind: fact
  notes: "File is named '_refinance' but the form (H-25(D)) is a purchase-transaction sample about satisfying the seller's junior lien; the question avoids calling it a refinance."

