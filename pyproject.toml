[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docuchat"
version = "0.1.0"
description = "Document chat: upload PDFs, ask questions."
requires-python = ">=3.11"
dependencies = [
    "llama-index-core==0.14.25",
    "llama-index-llms-anthropic==0.12.1",
    "llama-index-llms-google-genai==0.11.2",
    "llama-index-embeddings-huggingface==0.8.0",
    "docling==2.130.0",
    "rank-bm25==0.2.2",
    "sentence-transformers==6.1.0",
    "pyyaml==6.0.3",
    "pypdfium2==5.13.0",
]

[project.optional-dependencies]
local-llm = ["llama-index-llms-llama-cpp==0.7.0", "llama-cpp-python==0.3.35"]
dev = ["pytest==9.1.1"]
# langchain-community is pinned below 0.4: 0.4.x dropped the ChatVertexAI/
# VertexAI integrations that ragas==0.4.3 imports unconditionally at
# `import ragas` time, which otherwise breaks the extra on a fresh install.
eval-ragas = ["ragas==0.4.3", "langchain-community==0.3.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that require heavy/optional dependencies or network access",
]
