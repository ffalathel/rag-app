[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docuchat"
version = "0.1.0"
description = "Document chat: upload PDFs, ask questions."
requires-python = ">=3.11"
dependencies = [
    "llama-index-core==0.11.23",
    "llama-index-llms-anthropic==0.3.3",
    "llama-index-embeddings-huggingface==0.3.1",
    "docling==2.7.0",
    "rank-bm25==0.2.2",
    "sentence-transformers==3.2.1",
]

[project.optional-dependencies]
local-llm = ["llama-cpp-python==0.3.2"]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require heavy/optional dependencies or network access",
]
