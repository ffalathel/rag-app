name: eval

# Report-only: publishes the free arms' summary; no step checks metric values.
on:
  push:
    paths: ["src/**", "eval/**"]
  pull_request:
    paths: ["src/**", "eval/**"]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-BAAI/bge-small-en-v1.5-BAAI/bge-reranker-v2-m3
      - run: python -m docuchat.evaluate run --arms baseline,+hybrid,+rerank
      - run: cat eval/results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
